# ModelPilot（dsh-model-assistant）的打包补丁。
#
# 有且仅有一条 insert。组合条目的 id 同时充当插件自己的设置命名空间
# （设置服务按 entry.options.id 给文档建键），所以这个 id 必须永远保持
# "modelpilot" —— 改名等于做一次命名空间迁移，而不是重命名。
#
# 宿主半边（lib/index.js）由这一行挂载；Web 客户端半边（lib/client.js）
# 通过 package.json 的 `dsh.client` 声明注入。
- insert:
    - id: modelpilot
      name: dsh-model-assistant
