# ModelPilot (dsh-model-assistant) bundle patch.
#
# Exactly one insert. The composition entry id doubles as the plugin's own
# settings namespace (the settings service keys documents by entry.options.id),
# so the id MUST stay "modelpilot" forever — renaming it is a namespace
# migration, not a rename.
#
# The Host half (lib/index.js) is mounted by this row; the Web client half
# (lib/client.js) is injected through package.json's `dsh.client` declaration.
- insert:
    - id: modelpilot
      name: dsh-model-assistant
